<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant News</title>
    <link rel="icon" type="image/png" href="images/news.png">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/forgetpossward.js" defer></script>
</head>
<body>

<div class="tit">
    <h2>Instant News</h2>
</div>

<div class="login-container">
    <form class="login-box">
        <h2>Forget Password</h2>

        <input type="email" id="email" placeholder="Email" required>

        <button type="button" onclick="showOtp()">Generate OTP</button>

        <div id="otpSection" style="display: none; margin-top:15px;">
            <input type="text" id="otp" placeholder="Enter OTP">

            <button type="button" id="otp" onclick="verifyOtp()">
                Verify OTP
            </button>
        </div>

        <h5>New User <a href="Register.html">Register</a></h5>
    </form>
</div>

<video class="bg-video" autoplay muted loop playsinline id="my">
    <source src="videos/loginback.mp4" type="video/mp4">
</video>

</body>
</html>
